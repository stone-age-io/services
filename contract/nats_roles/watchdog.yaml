name: watchdog
description: "watchdog. Owns its two buckets and listens to the heartbeats it checks. A check on a subject outside the heartbeat channel needs that subject added here."
publish_permissions:
  - "$KV.watchdog_state.>"
  - "_INBOX.>"
  - "$JS.API.INFO"
  - "$JS.API.STREAM.*.KV_watchdog_checks"
  - "$JS.API.STREAM.MSG.GET.KV_watchdog_checks"
  - "$JS.API.CONSUMER.*.KV_watchdog_checks"
  - "$JS.API.CONSUMER.*.KV_watchdog_checks.>"
  - "$JS.API.CONSUMER.DURABLE.CREATE.KV_watchdog_checks.>"
  - "$JS.API.CONSUMER.MSG.NEXT.KV_watchdog_checks.>"
  - "$JS.API.DIRECT.GET.KV_watchdog_checks.>"
  - "$JS.ACK.KV_watchdog_checks.>"
  - "$JS.FC.KV_watchdog_checks.>"
  - "$JS.API.STREAM.*.KV_watchdog_state"
  - "$JS.API.STREAM.MSG.GET.KV_watchdog_state"
  - "$JS.API.CONSUMER.*.KV_watchdog_state"
  - "$JS.API.CONSUMER.*.KV_watchdog_state.>"
  - "$JS.API.CONSUMER.DURABLE.CREATE.KV_watchdog_state.>"
  - "$JS.API.CONSUMER.MSG.NEXT.KV_watchdog_state.>"
  - "$JS.API.DIRECT.GET.KV_watchdog_state.>"
  - "$JS.ACK.KV_watchdog_state.>"
  - "$JS.FC.KV_watchdog_state.>"
subscribe_permissions:
  - "watchdog.>"
  - "*.*.heartbeat"
  - "*.*.heartbeat.>"
  - "_INBOX.>"
  - "$SRV.>"
